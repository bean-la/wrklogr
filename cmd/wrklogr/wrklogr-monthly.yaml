# wrklogr-monthly.yaml
# Generates per-author worklog pages and publishes them to the repository's wiki.
# Runs on the 1st of each month and reports on the complete previous month.
#
# How it works:
#   1. Downloads the latest wrklogr binary from the GitHub release
#   2. Determines the full previous month range
#   3. Gathers unique contributors via the GitHub API
#   4. For each contributor, generates a wiki page with a per-project hour
#      summary (from --noko-dry-run) and the full report details
#   5. Pushes the pages to the wiki, updating the index
#
# Required setup:
#   - The repository must have the wiki enabled (Settings > Features > Wikis)
#   - WRKLOGR_REPOS variable set with all repos to scan (space-separated)
#   - GCAL_CALENDAR variable set with Google Calendar ID for iCal events
#   - WORKLOG_TOKEN secret: classic PAT with repo scope (cross-org access)
#   - NOKO_TOKEN secret: Noko API token (for project summaries and push)

name: Monthly Worklog

on:
  schedule:
    # Run at 02:00 UTC on the 1st of every month
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: ""
      until:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: ""
      author:
        description: "GitHub login to filter by (leave empty for all authors)"
        required: false
        default: ""
      show-commits:
        description: "Show individual commits in the report"
        type: boolean
        required: false
        default: false
      push-noko:
        description: "Push sessions to Noko"
        type: boolean
        required: false
        default: false
      gcal:
        description: "Include Google Calendar events"
        type: boolean
        required: false
        default: true

env:
  WRKLOGR_VERSION: latest
  NOKO_TOKEN: ${{ secrets.NOKO_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push to the wiki (separate ref)

    steps:
      - name: Download wrklogr binary
        shell: bash
        run: |
          BASE="https://github.com/bean-la/wrklogr/releases"
          if [ "${{ env.WRKLOGR_VERSION }}" = "latest" ]; then
            URL="${BASE}/latest/download/wrklogr-linux-amd64"
          else
            URL="${BASE}/download/${{ env.WRKLOGR_VERSION }}/wrklogr-linux-amd64"
          fi
          curl -sL "$URL" -o /tmp/wrklogr
          chmod +x /tmp/wrklogr
          /tmp/wrklogr version

      - name: Determine month range
        id: month
        shell: bash
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            SINCE="${{ inputs.since }}"
            UNTIL="${{ inputs.until }}"
          else
            # Full previous month
            SINCE=$(date -u -d "$(date -u '+%Y-%m-01') - 1 month" '+%Y-%m-01')
            UNTIL=$(date -u -d "${SINCE} + 1 month - 1 second" '+%Y-%m-%d %H:%M:%S')
          fi

          echo "since=${SINCE}" >> "${GITHUB_OUTPUT}"
          echo "until=${UNTIL}" >> "${GITHUB_OUTPUT}"

          # e.g. "2026-03" – month label from the start date
          MONTH_LABEL=$(date -u -d "${SINCE}" '+%Y-%m')
          echo "month_label=${MONTH_LABEL}" >> "${GITHUB_OUTPUT}"

      - name: Gather contributors
        id: contributors
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SINCE="${{ steps.month.outputs.since }}"
          UNTIL="${{ steps.month.outputs.until }}"

          # If an author was explicitly given via dispatch, use only that one
          if [ -n "${{ inputs.author }}" ]; then
            echo "authors=${{ inputs.author }}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          REPOS="${{ vars.WRKLOGR_REPOS }}"
          echo "repos=${REPOS}" >> "${GITHUB_OUTPUT}"

          AUTHORS=""
          for REPO in ${REPOS}; do
            PAGE=1
            while true; do
              DATA=$(gh api \
                "/repos/${REPO}/commits?since=${SINCE}T00:00:00Z&until=${UNTIL}T23:59:59Z&per_page=100&page=${PAGE}" \
                --jq '.[].author.login // empty' 2>/dev/null)
              if [ -z "${DATA}" ]; then
                break
              fi
              for LOGIN in ${DATA}; do
                if ! echo "${AUTHORS}" | grep -qw "${LOGIN}"; then
                  AUTHORS="${AUTHORS} ${LOGIN}"
                fi
              done
              PAGE=$((PAGE + 1))
            done
          done

          AUTHORS=$(echo "${AUTHORS}" | xargs)
          echo "authors=${AUTHORS}" >> "${GITHUB_OUTPUT}"

      - name: Create wrklogr config
        shell: bash
        run: |
          cat > /tmp/wrklogr.toml << CONFIG
          session_gap = "2h"
          timezone = "UTC"
          repos = [
          $(for R in ${{ vars.WRKLOGR_REPOS }}; do echo "  \"$R\","; done)
          ]

          [gcal]
          calendar = "${{ vars.GCAL_CALENDAR }}"
          CONFIG

      - name: Generate author pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SINCE="${{ steps.month.outputs.since }}"
          UNTIL="${{ steps.month.outputs.until }}"
          MONTH_LABEL="${{ steps.month.outputs.month_label }}"
          AUTHORS="${{ steps.contributors.outputs.authors }}"
          REPOS="${{ steps.contributors.outputs.repos }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          NOW_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')

          SHOW_COMMITS_FLAG=""
          if [ "${{ inputs.show-commits }}" = "true" ]; then
            SHOW_COMMITS_FLAG="--show-commits"
          fi
          REPOS_FLAG=""
          if [ -n "${REPOS}" ]; then
            REPOS_CSV=$(echo "${REPOS}" | tr ' ' ',')
            REPOS_FLAG="--repos ${REPOS_CSV}"
          fi
          GCAL_FLAG=""
          if [ "${{ inputs.gcal }}" = "true" ] && [ -n "${{ vars.GCAL_CALENDAR }}" ]; then
            GCAL_FLAG="--gcal"
          fi

          mkdir -p /tmp/wiki-pages

          if [ -z "${AUTHORS}" ]; then
            printf 'No contributors found in this period.\n' > /tmp/wiki-pages/_empty
          else
            for AUTHOR in ${AUTHORS}; do
              PAGE="${AUTHOR}.md"

              # Get project breakdown from noko dry-run
              PROJECT_TABLE=""
              if [ -n "${{ secrets.NOKO_TOKEN }}" ]; then
                NOKIO_OUTPUT=$(/tmp/wrklogr report \
                  --config /tmp/wrklogr.toml \
                  --since "${SINCE}" \
                  --until "${UNTIL}" \
                  --local=false \
                  --author "${AUTHOR}" \
                  ${REPOS_FLAG} \
                  --noko-dry-run \
                  2>&1 || true)

                declare -A PROJECT_HOURS
                while IFS= read -r LINE; do
                  if [[ $LINE =~ ^[[:space:]]+([0-9]{4}-[0-9]{2}-[0-9]{2})[[:space:]]+([0-9]+)m[[:space:]]+project=([0-9]+)[[:space:]]+(.+) ]]; then
                    MINUTES="${BASH_REMATCH[2]}"
                    PROJ_ID="${BASH_REMATCH[3]}"
                    if [ "$PROJ_ID" = "0" ]; then
                      continue
                    fi
                    HOURS=$(( (MINUTES + 59) / 60 ))
                    OLD_HOURS=${PROJECT_HOURS[$PROJ_ID]:-0}
                    PROJECT_HOURS[$PROJ_ID]=$((OLD_HOURS + HOURS))
                  fi
                done <<< "$NOKIO_OUTPUT"

                if [ ${#PROJECT_HOURS[@]} -gt 0 ]; then
                  PROJECT_TABLE="## Summary by Project

| Project | Hours |
|---------|-------|
"
                  for PROJ_ID in "${!PROJECT_HOURS[@]}"; do
                    NAME="Project $PROJ_ID"
                    case "$PROJ_ID" in
                      687237) NAME="Bean" ;;
                      708823) NAME="Third Eye" ;;
                      716638) NAME="Dear Freeda (TMV)" ;;
                      586501) NAME="Dublab" ;;
                      611157) NAME="Salon 94" ;;
                      560046) NAME="Jono Pandolfi" ;;
                      607240) NAME="Farm To People" ;;
                      557928) NAME="Culinistas" ;;
                      595328) NAME="Minisocial" ;;
                      615238) NAME="Tripoli Gallery" ;;
                      606165) NAME="Max Levai" ;;
                      662679) NAME="Ghia" ;;
                      639789) NAME="Syng" ;;
                      590606) NAME="Tartine" ;;
                    esac
                    PROJECT_TABLE+="| $NAME | ${PROJECT_HOURS[$PROJ_ID]}h |
"
                  done
                  PROJECT_TABLE+="
"
                fi
              fi

              # Get full report
              REPORT=$(/tmp/wrklogr report \
                --config /tmp/wrklogr.toml \
                --since "${SINCE}" \
                --until "${UNTIL}" \
                --local=false \
                --author "${AUTHOR}" \
                ${REPOS_FLAG} \
                ${SHOW_COMMITS_FLAG} \
                ${GCAL_FLAG} \
                2>&1 || true)

              # Build the author page
              {
                printf '# %s\n\n' "${AUTHOR}"
                printf 'Period: %s to %s\n\n' "${SINCE}" "${UNTIL}"
                printf '%s' "${PROJECT_TABLE}"
                printf '## Details\n\n```\n'
                printf '%s\n' "${REPORT}"
                printf '```\n\n'
                printf -- '---\n'
                printf '_Generated by [wrklogr](%s) on %s_\n' "${REPO_URL}" "${NOW_UTC}"
              } > "/tmp/wiki-pages/${PAGE}"

            done
          fi

          echo "${MONTH_LABEL}" > /tmp/wrklogr-month.txt
          echo "${SINCE}" > /tmp/wrklogr-since.txt
          echo "${UNTIL}" > /tmp/wrklogr-until.txt
          echo "${AUTHORS}" > /tmp/wrklogr-authors.txt

      - name: Push sessions to Noko
        if: inputs.push-noko == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          /tmp/wrklogr report \
            --config /tmp/wrklogr.toml \
            --since "${{ steps.month.outputs.since }}" \
            --until "${{ steps.month.outputs.until }}" \
            --local=false \
            --author "${{ github.actor }}" \
            --push-noko \
            ${GCAL_FLAG} \
            ${REPOS_FLAG}

      - name: Push to wiki
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MONTH_LABEL=$(cat /tmp/wrklogr-month.txt)
          AUTHORS=$(cat /tmp/wrklogr-authors.txt)
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"

          # Shallow clone the wiki repo using the token
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.wiki.git" \
            /tmp/wiki \
            --depth 1

          cd /tmp/wiki

          git config user.name  "wrklogr-bot"
          git config user.email "wrklogr-bot@users.noreply.github.com"

          # Copy each author page
          for AUTHOR in ${AUTHORS}; do
            if [ -f "/tmp/wiki-pages/${AUTHOR}.md" ]; then
              cp "/tmp/wiki-pages/${AUTHOR}.md" "${AUTHOR}.md"
              git add "${AUTHOR}.md"
            fi
          done

          # Build index page with links to all authors
          {
            printf '# Worklogs\n\n'
            printf 'Monthly reports generated by [wrklogr](https://github.com/%s/%s).\n' "${OWNER}" "${REPO}"
            printf 'Period: %s\n\n' "${MONTH_LABEL}"
            for AUTHOR in ${AUTHORS}; do
              printf -- '- [%s](./%s)\n' "${AUTHOR}" "${AUTHOR}"
            done
            printf '\n'
          } > Worklogs.md
          git add Worklogs.md

          git commit -m "Update worklog reports for ${MONTH_LABEL}" || true
          git push
