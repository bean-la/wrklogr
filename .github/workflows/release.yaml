# release.yaml
# Builds binaries and uploads to a GitHub Release whenever a v* tag is pushed.
#
# Tag creation is handled by bump.yaml (auto-bumps patch on main pushes).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          BINARY="wrklogr-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o "/tmp/${BINARY}" \
            ./cmd/wrklogr/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: /tmp/wrklogr-${{ matrix.goos }}-${{ matrix.goarch }}
