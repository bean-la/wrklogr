# wrklogr-monthly.yaml
# Generates per-author worklog pages and publishes them to the repository's wiki.
# Runs on the 1st of each month and reports on the complete previous month.
#
# How it works:
#   1. Downloads the latest wrklogr binary from the GitHub release
#   2. Determines the full previous month range
#   3. Gathers unique contributors via the GitHub API
#   4. For each contributor, generates a wiki page with a per-project hour
#      summary (from --noko-dry-run) and the full report details
#   5. Pushes the pages to the wiki, updating the index
#
# Required setup:
#   - The repository must have the wiki enabled (Settings > Features > Wikis)
#   - WRKLOGR_REPOS variable set with all repos to scan (space-separated)
#   - GCAL_CALENDAR variable set with Google Calendar ID for iCal events
#   - WORKLOG_TOKEN secret: classic PAT with repo scope (cross-org access)
#   - NOKO_TOKEN secret: Noko API token (for project summaries and push)

name: Monthly Worklog

on:
  schedule:
    # Run at 02:00 UTC on the 1st of every month
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: ""
      until:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: ""
      author:
        description: "GitHub login to filter by (leave empty for all authors)"
        required: false
        default: ""
      show-commits:
        description: "Show individual commits in the report"
        type: boolean
        required: false
        default: false
      push-noko:
        description: "Push sessions to Noko"
        type: boolean
        required: false
        default: false
      gcal:
        description: "Include Google Calendar events"
        type: boolean
        required: false
        default: true

env:
  WRKLOGR_VERSION: latest
  NOKO_TOKEN: ${{ secrets.NOKO_TOKEN }}
  LLM_API_KEY: ${{ secrets.LLM_API_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push to the wiki (separate ref)

    steps:
      - name: Download wrklogr binary
        shell: bash
        run: |
          BASE="https://github.com/bean-la/wrklogr/releases"
          if [ "${{ env.WRKLOGR_VERSION }}" = "latest" ]; then
            URL="${BASE}/latest/download/wrklogr-linux-amd64"
          else
            URL="${BASE}/download/${{ env.WRKLOGR_VERSION }}/wrklogr-linux-amd64"
          fi
          curl -sL "$URL" -o /tmp/wrklogr
          chmod +x /tmp/wrklogr
          /tmp/wrklogr version

      - name: Determine month range
        id: month
        shell: bash
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            SINCE="${{ inputs.since }}"
            UNTIL=$(echo "${{ inputs.until }}" | sed 's/T.*//')
          else
            SINCE=$(date -u -d "$(date -u '+%Y-%m-01') - 1 month" '+%Y-%m-01')
            UNTIL=$(date -u -d "${SINCE} + 1 month - 1 second" '+%Y-%m-%d')
          fi

          echo "since=${SINCE}" >> "${GITHUB_OUTPUT}"
          echo "until=${UNTIL}" >> "${GITHUB_OUTPUT}"

          MONTH_LABEL=$(date -u -d "${SINCE}" '+%m-%Y')
          echo "month_label=${MONTH_LABEL}" >> "${GITHUB_OUTPUT}"

      - name: Gather contributors
        id: contributors
        shell: bash
        run: |
          # Explicit author override via workflow dispatch
          if [ -n "${{ inputs.author }}" ]; then
            echo "authors=${{ inputs.author }}" >> "${GITHUB_OUTPUT}"
          else
            echo "authors=sebbean nphillips" >> "${GITHUB_OUTPUT}"
          fi

          echo "repos=${{ vars.WRKLOGR_REPOS }}" >> "${GITHUB_OUTPUT}"

      - name: Create wrklogr config
        shell: bash
        run: |
          cat > /tmp/wrklogr.toml << CONFIG
          session_gap = "2h"
          timezone = "UTC"
          repos = [
          $(for R in ${{ vars.WRKLOGR_REPOS }}; do echo "  \"$R\","; done)
          ]

          [noko]
          min_log_minutes = 60

          [noko.projects]
          "bean-la/shtack" = { project_id = 687237 }
          "bean-la/wrklogr" = { project_id = 687237 }
          "bean-la/harness-web" = { project_id = 687237 }
          "bean-la/slyce-studio" = { project_id = 687237 }
          "bean-la/slyce-install" = { project_id = 687237 }
          "bean-la/desert-radio-next" = { project_id = 687237 }
          "bean-la/tmv-vote" = { project_id = 716638 }
          "Third-Eye-Tarot/rainbow-mono" = { project_id = 708823 }
          "Third-Eye-Tarot/deck" = { project_id = 708823 }
          "Third-Eye-Tarot/marketing-web" = { project_id = 708823 }
          "futurerootsinc/dublab-wp" = { project_id = 586501 }

          [llm]
          model = "deepseek-chat"
          base_url = "https://api.deepseek.com/v1"

          [gcal]
          calendar = "${{ vars.GCAL_CALENDAR }}"
          CONFIG

      - name: Generate author pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SINCE="${{ steps.month.outputs.since }}"
          UNTIL="${{ steps.month.outputs.until }}"
          MONTH_LABEL="${{ steps.month.outputs.month_label }}"
          AUTHORS="${{ steps.contributors.outputs.authors }}"
          REPOS="${{ steps.contributors.outputs.repos }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          NOW_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')

          SHOW_COMMITS_FLAG=""
          if [ "${{ inputs.show-commits }}" = "true" ]; then
            SHOW_COMMITS_FLAG="--show-commits"
          fi
          REPOS_FLAG=""
          if [ -n "${REPOS}" ]; then
            REPOS_CSV=$(echo "${REPOS}" | tr ' ' ',')
            REPOS_FLAG="--repos ${REPOS_CSV}"
          fi
          GCAL_FLAG=""
          if [ "${{ inputs.gcal }}" = "true" ] && [ -n "${{ vars.GCAL_CALENDAR }}" ]; then
            GCAL_FLAG="--gcal"
          fi

          mkdir -p "/tmp/wiki-pages/${MONTH_LABEL}"

          if [ -z "${AUTHORS}" ]; then
            printf 'No contributors found in this period.\n' > /tmp/wiki-pages/_empty
          else
            for AUTHOR in ${AUTHORS}; do
              PAGE="${MONTH_LABEL}/${AUTHOR}.md"

              # Run report with show-commits + noko-dry-run to get everything
              COMBINED=$(/tmp/wrklogr report \
                --config /tmp/wrklogr.toml \
                --since "${SINCE}" --until "${UNTIL}" --local=false \
                --author "${AUTHOR}" ${REPOS_FLAG} ${SHOW_COMMITS_FLAG} ${GCAL_FLAG} --llm-summarize --noko-dry-run 2>&1 || true)

              # Split on noko separator
              if echo "$COMBINED" | grep -q "Noko dry run"; then
                REPORT_PART=$(echo "$COMBINED" | sed '/Noko dry run/Q')
                NOKO_PART=$(echo "$COMBINED" | sed -n '/Noko dry run/,$ p')
              else
                REPORT_PART="$COMBINED"
                NOKO_PART=""
              fi

              # Parse noko log lines per day
              mkdir -p /tmp/noko-logs
              while IFS= read -r LINE; do
                if [[ $LINE =~ ^[[:space:]]+([0-9]{4}-[0-9]{2}-[0-9]{2})[[:space:]]+([0-9]+)m[[:space:]]+project=([0-9]+)[[:space:]]+(.+) ]]; then
                  D="${BASH_REMATCH[1]}"
                  M="${BASH_REMATCH[2]}"
                  P="${BASH_REMATCH[3]}"
                  DESC="${BASH_REMATCH[4]}"
                  if [ "$P" = "0" ]; then continue; fi
                  PROJ_NAME="Project $P"
                  case "$P" in
                    687237) PROJ_NAME="Bean" ;;
                    708823) PROJ_NAME="Third Eye" ;;
                    716638) PROJ_NAME="Dear Freeda (TMV)" ;;
                    586501) PROJ_NAME="Dublab" ;;
                    611157) PROJ_NAME="Salon 94" ;;
                    560046) PROJ_NAME="Jono Pandolfi" ;;
                    607240) PROJ_NAME="Farm To People" ;;
                    557928) PROJ_NAME="Culinistas" ;;
                    595328) PROJ_NAME="Minisocial" ;;
                    615238) PROJ_NAME="Tripoli Gallery" ;;
                    606165) PROJ_NAME="Max Levai" ;;
                    662679) PROJ_NAME="Ghia" ;;
                    639789) PROJ_NAME="Syng" ;;
                    590606) PROJ_NAME="Tartine" ;;
                  esac
                  H=$(( (M + 59) / 60 ))
                  printf '  - %s · %sm · %s\n' "$D" "$M" "$DESC" >> "/tmp/noko-logs/$P.txt"
                  OLD_H=${PROJ_HOURS[$P]:-0}
                  PROJ_HOURS[$P]=$((OLD_H + H))
                fi
              done <<< "$NOKO_PART"

              # Build project summary table
              if [ ${#PROJ_HOURS[@]} -gt 0 ]; then
                SUM_FILE=$(mktemp)
                printf '## Summary\n\n' > "$SUM_FILE"
                printf '| Project | Hours |\n' >> "$SUM_FILE"
                printf '|---------|-------|\n' >> "$SUM_FILE"
                TOTAL_H=0
                for P in "${!PROJ_HOURS[@]}"; do
                  PROJ_NAME="Project $P"
                  case "$P" in
                    687237) PROJ_NAME="Bean" ;; 708823) PROJ_NAME="Third Eye" ;;
                    716638) PROJ_NAME="Dear Freeda (TMV)" ;; 586501) PROJ_NAME="Dublab" ;;
                    611157) PROJ_NAME="Salon 94" ;; 560046) PROJ_NAME="Jono Pandolfi" ;;
                    607240) PROJ_NAME="Farm To People" ;; 557928) PROJ_NAME="Culinistas" ;;
                    595328) PROJ_NAME="Minisocial" ;; 615238) PROJ_NAME="Tripoli Gallery" ;;
                    606165) PROJ_NAME="Max Levai" ;; 662679) PROJ_NAME="Ghia" ;;
                    639789) PROJ_NAME="Syng" ;; 590606) PROJ_NAME="Tartine" ;;
                  esac
                  printf '| %s | %sh |\n' "$PROJ_NAME" "${PROJ_HOURS[$P]}" >> "$SUM_FILE"
                  TOTAL_H=$((TOTAL_H + PROJ_HOURS[$P]))
                done
                printf '| **Total** | **%sh** |\n' "$TOTAL_H" >> "$SUM_FILE"
              fi

              # Build day-by-day page content
              PAGE_FILE="/tmp/wiki-pages/${PAGE}"
              {
                printf '# %s — %s\n\n' "${AUTHOR}" "${MONTH_LABEL}"
                printf 'Period: %s → %s\n\n' "${SINCE}" "${UNTIL}"

                if [ -n "$SUM_FILE" ]; then
                  cat "$SUM_FILE"
                  printf '\n'
                fi

                printf -- '---\n\n'

                for PROJ_FILE in /tmp/noko-logs/*.txt; do
                  [ -f "$PROJ_FILE" ] || continue
                  P=$(basename "$PROJ_FILE" .txt)
                  PROJ_NAME="Project $P"
                  case "$P" in
                    687237) PROJ_NAME="Bean" ;; 708823) PROJ_NAME="Third Eye" ;;
                    716638) PROJ_NAME="Dear Freeda (TMV)" ;; 586501) PROJ_NAME="Dublab" ;;
                    611157) PROJ_NAME="Salon 94" ;; 560046) PROJ_NAME="Jono Pandolfi" ;;
                    607240) PROJ_NAME="Farm To People" ;; 557928) PROJ_NAME="Culinistas" ;;
                    595328) PROJ_NAME="Minisocial" ;; 615238) PROJ_NAME="Tripoli Gallery" ;;
                    606165) PROJ_NAME="Max Levai" ;; 662679) PROJ_NAME="Ghia" ;;
                    639789) PROJ_NAME="Syng" ;; 590606) PROJ_NAME="Tartine" ;;
                  esac
                  printf '## %s\n\n' "$PROJ_NAME"
                  cat "$PROJ_FILE"
                  printf '\n'
                done

                printf -- '---\n'
                printf '_Generated by [wrklogr](%s) on %s_\n' "${REPO_URL}" "${NOW_UTC}"
              } > "$PAGE_FILE"

              [ -n "$SUM_FILE" ] && rm -f "$SUM_FILE"
              rm -rf /tmp/noko-logs
            done
          fi

          echo "${MONTH_LABEL}" > /tmp/wrklogr-month.txt
          echo "${SINCE}" > /tmp/wrklogr-since.txt
          echo "${UNTIL}" > /tmp/wrklogr-until.txt
          echo "${AUTHORS}" > /tmp/wrklogr-authors.txt

      - name: Push sessions to Noko
        if: inputs.push-noko == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          /tmp/wrklogr report \
            --config /tmp/wrklogr.toml \
            --since "${{ steps.month.outputs.since }}" \
            --until "${{ steps.month.outputs.until }}" \
            --local=false \
            --author "${{ github.actor }}" \
            --push-noko \
            ${GCAL_FLAG} \
            ${REPOS_FLAG}

      - name: Push to wiki
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MONTH_LABEL=$(cat /tmp/wrklogr-month.txt)
          AUTHORS=$(cat /tmp/wrklogr-authors.txt)
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"

          # Shallow clone the wiki repo using the token
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.wiki.git" \
            /tmp/wiki \
            --depth 1

          cd /tmp/wiki

          git config user.name  "wrklogr-bot"
          git config user.email "wrklogr-bot@users.noreply.github.com"

          # Remove old per-month and stale top-level author pages
          git rm -f worklog-*.md 2>/dev/null || true
          for F in *.md; do
            case "$F" in
              Home.md|Worklogs.md) ;;
              *) git rm -f "$F" 2>/dev/null || true ;;
            esac
          done

          # Create month directory and copy author pages
          mkdir -p "${MONTH_LABEL}"
          for AUTHOR in ${AUTHORS}; do
            SRC="/tmp/wiki-pages/${MONTH_LABEL}/${AUTHOR}.md"
            if [ -f "$SRC" ]; then
              cp "$SRC" "${MONTH_LABEL}/${AUTHOR}.md"
              git add "${MONTH_LABEL}/${AUTHOR}.md"
            fi
          done

          # Build index page with links to all authors for this month
          {
            printf '# Worklogs\n\n'
            printf 'Monthly reports generated by [wrklogr](https://github.com/%s/%s).\n' "${OWNER}" "${REPO}"
            printf 'Period: %s\n\n' "${MONTH_LABEL}"
            for AUTHOR in ${AUTHORS}; do
              printf -- '- [%s](./%s/%s)\n' "${AUTHOR}" "${MONTH_LABEL}" "${AUTHOR}"
            done
            printf '\n'
          } > Worklogs.md
          git add Worklogs.md

          git commit -m "Update worklog reports for ${MONTH_LABEL}" || true
          git push
