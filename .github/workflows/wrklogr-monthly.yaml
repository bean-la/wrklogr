# wrklogr-monthly.yaml
# Generates per-author worklog pages and publishes them to the repository's wiki.
# Runs on the 1st of each month and reports on the complete previous month.
#
# How it works:
#   1. Downloads the latest wrklogr binary from the GitHub release
#   2. Determines the full previous month range
#   3. Discovers repos from configured orgs and matching authors
#   4. Generates wiki pages with per-project hour summaries and daily logs
#   5. Pushes the pages to the wiki, updating the index
#
# Required setup:
#   - The repository must have the wiki enabled (Settings > Features > Wikis)
#   - WRKLOGR_ORGS variable set with space-separated GitHub org names
#   - WRKLOGR_AUTHORS variable set with space-separated GitHub logins
#   - GCAL_CALENDAR variable set with Google Calendar ID for iCal events
#   - WORKLOG_TOKEN secret: classic PAT with repo scope (cross-org access)
#   - NOKO_TOKEN secret: Noko API token (for project summaries and push)

name: Monthly Worklog

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: ""
      until:
        description: "End date (YYYY-MM-DD)"
        required: false
        default: ""
      author:
        description: "GitHub login to filter by (overrides WRKLOGR_AUTHORS)"
        required: false
        default: ""
      show-commits:
        description: "Show individual commits in the report"
        type: boolean
        required: false
        default: false
      push-noko:
        description: "Push sessions to Noko"
        type: boolean
        required: false
        default: false
      gcal:
        description: "Include Google Calendar events"
        type: boolean
        required: false
        default: true

env:
  WRKLOGR_VERSION: latest
  NOKO_TOKEN: ${{ secrets.NOKO_TOKEN }}
  LLM_API_KEY: ${{ secrets.LLM_API_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download wrklogr binary
        shell: bash
        run: |
          BASE="https://github.com/bean-la/wrklogr/releases"
          if [ "${{ env.WRKLOGR_VERSION }}" = "latest" ]; then
            URL="${BASE}/latest/download/wrklogr-linux-amd64"
          else
            URL="${BASE}/download/${{ env.WRKLOGR_VERSION }}/wrklogr-linux-amd64"
          fi
          curl -sL "$URL" -o /tmp/wrklogr
          chmod +x /tmp/wrklogr
          /tmp/wrklogr version

      - name: Determine month range
        id: month
        shell: bash
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            SINCE="${{ inputs.since }}"
            UNTIL=$(echo "${{ inputs.until }}" | sed 's/T.*//')
          else
            SINCE=$(date -u -d "$(date -u '+%Y-%m-01') - 1 month" '+%Y-%m-01')
            UNTIL=$(date -u -d "${SINCE} + 1 month - 1 second" '+%Y-%m-%d')
          fi
          echo "since=${SINCE}" >> "${GITHUB_OUTPUT}"
          echo "until=${UNTIL}" >> "${GITHUB_OUTPUT}"
          MONTH_LABEL=$(date -u -d "${SINCE}" '+%Y-%m')
          echo "month_label=${MONTH_LABEL}" >> "${GITHUB_OUTPUT}"

      - name: Resolve authors
        id: authors
        shell: bash
        run: |
          if [ -n "${{ inputs.author }}" ]; then
            echo "authors=${{ inputs.author }}" >> "${GITHUB_OUTPUT}"
          else
            echo "authors=${{ vars.WRKLOGR_AUTHORS }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create wrklogr config
        shell: bash
        run: |
          cat > /tmp/wrklogr.toml << CONFIG
          session_gap = "2h"
          timezone = "UTC"

          [noko]
          min_log_minutes = 60

          [noko.projects]
          "bean-la/shtack" = { project_id = 687237 }
          "bean-la/wrklogr" = { project_id = 687237 }
          "bean-la/harness-web" = { project_id = 687237 }
          "bean-la/slyce-studio" = { project_id = 687237 }
          "bean-la/slyce-install" = { project_id = 687237 }
          "bean-la/desert-radio-next" = { project_id = 687237 }
          "bean-la/tmv-vote" = { project_id = 716638 }
          "Third-Eye-Tarot/rainbow-mono" = { project_id = 708823 }
          "Third-Eye-Tarot/deck" = { project_id = 708823 }
          "Third-Eye-Tarot/marketing-web" = { project_id = 708823 }
          "futurerootsinc/dublab-wp" = { project_id = 586501 }

          [llm]
          model = "deepseek-chat"
          base_url = "https://api.deepseek.com/v1"

          [gcal]
          calendar = "${{ vars.GCAL_CALENDAR }}"
          CONFIG

      - name: Clone wiki (for cache)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.wiki.git" \
            /tmp/wiki --depth 1
          cd /tmp/wiki
          git config user.name  "wrklogr-bot"
          git config user.email "wrklogr-bot@users.noreply.github.com"
          mkdir -p /tmp/wrklogr-cache
          if [ -d _cache ]; then
            cp -r _cache/* /tmp/wrklogr-cache/ 2>/dev/null || true
            echo "restored cache from wiki"
          fi

      - name: Generate wiki pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SINCE="${{ steps.month.outputs.since }}"
          UNTIL="${{ steps.month.outputs.until }}"
          ORGS="${{ vars.WRKLOGR_ORGS }}"
          AUTHORS="${{ steps.authors.outputs.authors }}"

          FLAGS=""
          if [ "${{ inputs.show-commits }}" = "true" ]; then
            FLAGS="${FLAGS} --show-commits"
          fi
          if [ "${{ vars.WRKLOGR_NO_GCAL }}" != "true" ] && [ "${{ inputs.gcal }}" != "false" ] && [ -n "${{ vars.GCAL_CALENDAR }}" ]; then
            FLAGS="${FLAGS} --gcal"
          fi

          ORG_FLAGS=""
          for ORG in ${ORGS}; do
            ORG_FLAGS="${ORG_FLAGS} --orgs ${ORG}"
          done
          AUTHOR_FLAGS=""
          for AUTHOR in ${AUTHORS}; do
            AUTHOR_FLAGS="${AUTHOR_FLAGS} --authors ${AUTHOR}"
          done

          /tmp/wrklogr generate-wiki \
            --config /tmp/wrklogr.toml \
            ${ORG_FLAGS} \
            ${AUTHOR_FLAGS} \
            --since "${SINCE}" --until "${UNTIL}" \
            --output /tmp/wiki-pages \
            --cache-dir /tmp/wrklogr-cache \
            --noko-dry-run \
            --llm-summarize \
            ${FLAGS}

      - name: Push sessions to Noko
        if: inputs.push-noko == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          GCAL_FLAG=""
          if [ "${{ vars.WRKLOGR_NO_GCAL }}" != "true" ] && [ "${{ inputs.gcal }}" != "false" ] && [ -n "${{ vars.GCAL_CALENDAR }}" ]; then
            GCAL_FLAG="--gcal"
          fi

          /tmp/wrklogr report \
            --config /tmp/wrklogr.toml \
            --since "${{ steps.month.outputs.since }}" \
            --until "${{ steps.month.outputs.until }}" \
            --local=false \
            --author "${{ github.actor }}" \
            --push-noko \
            ${GCAL_FLAG}

      - name: Push to wiki
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKLOG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          MONTH_LABEL=$(cat /tmp/wiki-pages/.month_label || echo "${{ steps.month.outputs.month_label }}")
          AUTHORS=$(cat /tmp/wiki-pages/.authors || echo "${{ steps.authors.outputs.authors }}")

          cd /tmp/wiki

          git rm -f worklog-*.md 2>/dev/null || true

          mkdir -p "${MONTH_LABEL}"
          for AUTHOR in ${AUTHORS}; do
            SRC="/tmp/wiki-pages/${MONTH_LABEL}/${AUTHOR}.md"
            if [ -f "$SRC" ]; then
              cp "$SRC" "${MONTH_LABEL}/${AUTHOR}.md"
              git add "${MONTH_LABEL}/${AUTHOR}.md"
            fi
          done

          # Save updated cache back to wiki
          rm -rf _cache
          cp -r /tmp/wrklogr-cache _cache
          git add _cache/

          {
            printf '# Worklogs\n\n'
            printf 'Monthly reports generated by [wrklogr](https://github.com/%s/%s).\n' "${OWNER}" "${REPO}"
            printf 'Period: %s\n\n' "${MONTH_LABEL}"
            for AUTHOR in ${AUTHORS}; do
              printf -- '- [%s](./%s/%s)\n' "${AUTHOR}" "${MONTH_LABEL}" "${AUTHOR}"
            done
            printf '\n'
          } > Worklogs.md
          git add Worklogs.md

          {
            printf '[Home](./Home)\n\n'
            for D in [0-9][0-9][0-9][0-9]-[0-9][0-9] [0-9][0-9]-[0-9][0-9][0-9][0-9]; do
              [ -d "$D" ] || continue
              printf '### %s\n' "$D"
              for F in "$D"/*.md; do
                [ -f "$F" ] || continue
                NAME=$(basename "$F" .md)
                printf -- '- [[%s/%s|%s]]\n' "$D" "$NAME" "$NAME"
              done
              printf '\n'
            done
            printf '[[Worklogs]]\n'
          } > _Sidebar.md
          git add _Sidebar.md

          git commit -m "Update worklog reports for ${MONTH_LABEL}" || true
          git push
